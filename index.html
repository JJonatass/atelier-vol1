<title>Soluções Digitais para um Futuro Sustentável</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F5F0; --card:#FFFFFF; --card-2:#F7FAF5;
    --ink:#1C2420; --ink-soft:#59645C; --ink-faint:#8B968E;
    --line:#D6DED1; --line-soft:#E7EEE3;
    --accent:#1F6F4E; --accent-strong:#164F38; --accent-ink:#F1FBF5;
    --accent-2:#B8862E; --accent-2-ink:#2A1E06;
    --success:#2E7D4F; --success-bg:#E7F3EB;
    --warning:#93650A; --warning-bg:#FBF0DC;
    --error:#AE3227; --error-bg:#FBEAE7;
    --info:#2B5F8A; --info-bg:#E8F0F7;
    --radius-sm:6px; --radius-md:12px; --radius-lg:18px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --shadow-card: 0 1px 2px rgba(28,36,32,0.06), 0 1px 0 rgba(28,36,32,0.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141815; --card:#1C2119; --card-2:#20261D;
      --ink:#E9EEE6; --ink-soft:#ABB6A6; --ink-faint:#78826F;
      --line:#2B3227; --line-soft:#242B21;
      --accent:#5FBF8E; --accent-strong:#7ED2A6; --accent-ink:#07130D;
      --accent-2:#E0AE52; --accent-2-ink:#241A05;
      --success:#6BC290; --success-bg:#182420;
      --warning:#E3B45C; --warning-bg:#2A2114;
      --error:#E38178; --error-bg:#2A1917;
      --info:#8FB6DA; --info-bg:#161F27;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141815; --card:#1C2119; --card-2:#20261D;
    --ink:#E9EEE6; --ink-soft:#ABB6A6; --ink-faint:#78826F;
    --line:#2B3227; --line-soft:#242B21;
    --accent:#5FBF8E; --accent-strong:#7ED2A6; --accent-ink:#07130D;
    --accent-2:#E0AE52; --accent-2-ink:#241A05;
    --success:#6BC290; --success-bg:#182420;
    --warning:#E3B45C; --warning-bg:#2A2114;
    --error:#E38178; --error-bg:#2A1917;
    --info:#8FB6DA; --info-bg:#161F27;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); margin:0; padding-inline:16px; }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0 0 8px; color:var(--ink); }
  p{ line-height:1.55; margin:0 0 10px; color:var(--ink-soft); }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  .mono{ font-family:var(--font-mono); }
  button{ font-family:var(--font-body); cursor:pointer; }
  input,textarea,select{ font-family:var(--font-body); font-size:14px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px; width:100%; }
  input:focus,textarea:focus,select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  textarea{ resize:vertical; min-height:64px; line-height:1.45; }
  label.field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  .field-hint{ font-size:12.5px; color:var(--ink-faint); margin-top:5px; }
  .app{ max-width:1180px; margin:0 auto; display:flex; gap:28px; align-items:flex-start; padding-block:22px 60px; }
  .sidebar{ width:272px; flex-shrink:0; position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:17px; flex-shrink:0; }
  .brand-text .k{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }
  .brand-text .t{ font-family:var(--font-display); font-size:16.5px; font-weight:600; line-height:1.15; }
  .progress-pill{ font-size:12px; color:var(--ink-soft); background:var(--card); border:1px solid var(--line); border-radius:99px; padding:5px 11px; display:inline-flex; align-items:center; gap:6px; margin-bottom:18px; }
  .chapter-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin:18px 0 8px; padding-left:2px; }
  .nav-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius-sm); cursor:pointer; margin-bottom:2px; border:1px solid transparent; }
  .nav-item:hover{ background:var(--card-2); }
  .nav-item.active{ background:var(--card); border-color:var(--line); box-shadow:var(--shadow-card); }
  .nav-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--line); }
  .nav-dot.done{ background:var(--success); }
  .nav-dot.progress{ background:var(--accent-2); }
  .nav-item .lbl{ font-size:13.5px; line-height:1.25; color:var(--ink); }
  .nav-item.active .lbl{ font-weight:600; }
  .theme-toggle{ display:flex; gap:6px; margin-top:20px; }
  .theme-toggle button{ flex:1; font-size:12px; padding:6px 4px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--card); color:var(--ink-soft); }
  .theme-toggle button.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .main{ flex:1; min-width:0; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-card); padding:22px 24px; margin-bottom:18px; }
  .eyebrow{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:600; margin-bottom:6px; }
  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:700px){ .app{flex-direction:column;} .sidebar{position:static; width:100%;} .home-grid{grid-template-columns:1fr;} }
  .art-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; cursor:pointer; box-shadow:var(--shadow-card); transition:transform .12s ease; }
  .art-card:hover{ transform:translateY(-2px); }
  .art-card .n{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); }
  .art-card h4{ font-size:16px; margin:4px 0 6px; }
  .art-card p{ font-size:13px; margin:0; }
  .stepper{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .step-dot{ display:flex; align-items:center; gap:7px; font-size:12px; padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:var(--card-2); color:var(--ink-faint); cursor:pointer; }
  .step-dot .num{ width:16px; height:16px; border-radius:50%; background:var(--line); color:var(--card); font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .step-dot.active{ border-color:var(--accent); color:var(--ink); background:var(--card); }
  .step-dot.active .num{ background:var(--accent); color:var(--accent-ink); }
  .step-dot.done .num{ background:var(--success); color:#fff; }
  .book-note{ background:var(--card-2); border:1px solid var(--line-soft); border-left:3px solid var(--accent-2); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:20px; }
  .book-note .tag{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-2); font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .book-note p:last-child{ margin-bottom:0; }
  .book-note p{ color:var(--ink); font-size:14px; }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:16px; border-top:1px solid var(--line-soft); }
  .btn{ font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn.danger{ background:var(--error-bg); color:var(--error); border-color:var(--error); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .list-editor .row{ display:flex; gap:8px; margin-bottom:8px; align-items:flex-start; }
  .list-editor .row input,.list-editor .row textarea{ flex:1; }
  .icon-btn{ width:32px; height:32px; flex-shrink:0; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--card); color:var(--ink-faint); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .add-row-btn{ font-size:13px; color:var(--accent); background:none; border:1px dashed var(--line); border-radius:var(--radius-sm); padding:8px 12px; width:100%; text-align:left; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid-2,.grid-3{ grid-template-columns:1fr; } }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; }
  .badge.success{ background:var(--success-bg); color:var(--success); }
  .badge.warning{ background:var(--warning-bg); color:var(--warning); }
  .badge.error{ background:var(--error-bg); color:var(--error); }
  .badge.info{ background:var(--info-bg); color:var(--info); }
  .badge.neutral{ background:var(--card-2); color:var(--ink-faint); border:1px solid var(--line); }
  table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  table.tbl th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:6px 8px; border-bottom:1px solid var(--line); }
  table.tbl td{ padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  .table-wrap{ overflow-x:auto; }
  .check-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:600px){ .check-grid{ grid-template-columns:1fr; } }
  .check-item{ display:flex; align-items:flex-start; gap:9px; font-size:13.5px; background:var(--card-2); border:1px solid var(--line-soft); border-radius:var(--radius-sm); padding:9px 11px; }
  .check-item input{ width:auto; margin-top:2px; }
  .summary-block{ background:var(--card-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; }
  .summary-block h4{ font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-bottom:8px; }
  .code-block{ background:var(--ink); color:var(--accent-ink); border-radius:var(--radius-sm); padding:14px 16px; font-family:var(--font-mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; line-height:1.6; }
  .copy-btn{ font-size:12px; padding:5px 11px; border-radius:99px; border:1px solid var(--line); background:var(--card); }
  .toolbar-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
  .welcome-hero{ padding:26px 26px 22px; }
  .step-count{ font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono); }
  .mini-note{ font-size:12.5px; color:var(--ink-faint); }
  .top-actions{ display:flex; gap:8px; }
  .ods-card{ background:var(--card-2); border:1px solid var(--line-soft); border-left:4px solid var(--accent); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:14px; }
  .ods-card-head{ display:flex; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .ods-num{ width:34px; height:34px; flex-shrink:0; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:16px; }
  .ods-apendice{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .ods-apendice p{ margin-bottom:4px; }

  /* ---------- canvas/board frames (exportable artifacts) ---------- */
  .canvas-frame{ border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow-card); }
  .canvas-frame-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; background:var(--card-2); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .canvas-frame-head .k{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; }
  .canvas-body{ padding:24px; background:var(--card); }
  .export-btn{ font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:99px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); }
  .export-btn:disabled{ opacity:.6; }
  .export-note{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; }

  /* board (kanban-style, for methods) */
  .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:820px){ .board{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .board{ grid-template-columns:1fr; } }
  .board-col{ background:var(--card-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; }
  .board-col h4{ font-size:12.5px; margin-bottom:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--accent); }
  .board-item{ background:var(--card); border:1px solid var(--line-soft); border-radius:6px; padding:9px 11px; font-size:12.5px; margin-bottom:8px; box-shadow:var(--shadow-card); color:var(--ink); }
  .board-item .lbl{ display:block; font-size:10.5px; text-transform:uppercase; color:var(--ink-faint); font-weight:700; margin-bottom:3px; }

  /* problem brief / one-pager */
  .brief-head{ display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-bottom:16px; border-bottom:2px solid var(--line); }
  .brief-badge{ width:52px; height:52px; flex-shrink:0; border-radius:12px; color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:22px; }
  .brief-quote{ font-family:var(--font-display); font-size:19px; line-height:1.4; color:var(--ink); margin:0 0 16px; padding:14px 18px; background:var(--card-2); border-left:4px solid var(--accent-2); border-radius:var(--radius-sm); }
  .brief-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .brief-grid{ grid-template-columns:1fr; } }
  .brief-cell{ background:var(--card-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px 15px; }
  .brief-cell .lbl{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); font-weight:700; margin-bottom:6px; }
  .brief-cell p{ color:var(--ink); font-size:13.5px; margin:0; }
  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .stat-pill{ flex:1; min-width:140px; background:var(--card-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 13px; }
  .stat-pill .n{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); text-transform:uppercase; }
  .stat-pill p{ margin:2px 0 0; font-size:13px; color:var(--ink); }

  /* SEV / risk gauges */
  .gauge-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:6px; }
  @media (max-width:640px){ .gauge-row{ grid-template-columns:1fr; } }
  .gauge{ border-radius:var(--radius-sm); padding:14px; border:2px solid var(--line); text-align:center; }
  .gauge.ok{ border-color:var(--success); background:var(--success-bg); }
  .gauge.no{ border-color:var(--error); background:var(--error-bg); }
  .gauge.pending{ background:var(--card-2); }
  .gauge .lbl{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--ink-soft); }
  .gauge .v{ font-family:var(--font-display); font-size:22px; font-weight:700; margin:4px 0; }
  .gauge.ok .v{ color:var(--success); } .gauge.no .v{ color:var(--error); } .gauge.pending .v{ color:var(--ink-faint); }
  .gauge p{ font-size:12px; margin:0; color:var(--ink-soft); text-align:left; }

  /* risk scorecard */
  .risk-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:760px){ .risk-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:520px){ .risk-grid{ grid-template-columns:1fr; } }
  .risk-card{ border-radius:var(--radius-sm); padding:13px; border:2px solid var(--line); background:var(--card-2); }
  .risk-card.presente{ border-color:var(--error); background:var(--error-bg); }
  .risk-card.ausente{ border-color:var(--success); background:var(--success-bg); }
  .risk-card h5{ margin:0 0 6px; font-size:13px; font-family:var(--font-display); color:var(--ink); }
  .risk-card p{ margin:0; font-size:12px; color:var(--ink-soft); }
  .method-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px; }
  @media (max-width:640px){ .method-grid{ grid-template-columns:1fr; } }
  .method-card{ border:2px solid var(--line); border-radius:var(--radius-sm); padding:16px; background:var(--card-2); cursor:pointer; transition:border-color .12s ease, transform .12s ease; }
  .method-card:hover{ transform:translateY(-2px); }
  .method-card.selected{ border-color:var(--accent); background:var(--success-bg); box-shadow:0 0 0 1px var(--accent) inset; }
  .method-card-icon{ font-size:22px; margin-bottom:6px; }
  .method-card h4{ margin:0 0 6px; font-size:15px; }
  .method-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .risk-score{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .risk-score .num{ font-family:var(--font-display); font-size:34px; font-weight:700; color:var(--ink); }

  /* empathy map quadrant board */
  .empathy-banner{ text-align:center; background:var(--accent); color:var(--accent-ink); border-radius:var(--radius-sm); padding:10px; font-family:var(--font-display); font-weight:600; font-size:16px; margin-bottom:14px; }
  .empathy-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px){ .empathy-grid{ grid-template-columns:1fr; } }
  .empathy-quad{ border-radius:var(--radius-md); padding:15px; border:2px solid var(--line); background:var(--card-2); }
  .empathy-quad h5{ display:flex; align-items:center; gap:7px; margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
  .empathy-quad p{ color:var(--ink); font-size:13.5px; margin:0; white-space:pre-wrap; }
  .empathy-quad.q1{ border-color:var(--info); } .empathy-quad.q1 h5{ color:var(--info); }
  .empathy-quad.q2{ border-color:var(--accent-2); } .empathy-quad.q2 h5{ color:var(--accent-2); }
  .empathy-quad.q3{ border-color:var(--success); } .empathy-quad.q3 h5{ color:var(--success); }
  .empathy-quad.q4{ border-color:var(--error); } .empathy-quad.q4 h5{ color:var(--error); }
  .empathy-quad.q4 .split{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .empathy-quad.q4 .split .g{ color:var(--success); font-weight:600; }
  .empathy-quad.q4 .split .d{ color:var(--error); font-weight:600; }

  /* persona ID card */
  .persona-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-card); }
  .persona-head{ display:flex; align-items:center; gap:13px; margin-bottom:12px; }
  .persona-avatar{ width:52px; height:52px; flex-shrink:0; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:21px; }
  .persona-head h4{ margin:0; font-size:17px; }
  .persona-head .sub{ font-size:12.5px; color:var(--ink-faint); }
  .persona-section{ margin-bottom:9px; }
  .persona-section .lbl{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; margin-bottom:2px; }
  .persona-section p{ margin:0; font-size:13px; color:var(--ink); }
  .persona-quote{ font-style:italic; font-family:var(--font-display); font-size:14.5px; border-left:3px solid var(--accent-2); padding-left:11px; color:var(--ink); margin-top:10px; }

  /* competitor matrix (heatmap) */
